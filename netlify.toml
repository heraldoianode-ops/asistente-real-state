[build]
  base    = "dashboard"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION            = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
