version: '3.9'

# PropTech AI Platform v0.9.0 — serverless-aligned compose.
# DB + backend = Supabase (cloud). Dashboard = Netlify (no container).
# This file only deploys the slim WhatsApp gateway and a free-first Ollama
# LLM host (Hetzner CX11). Legacy FastAPI/Celery/Redis/Postgres removed.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 10 && ollama pull llama3"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: on-failure

  whatsapp-gateway:
    build: ./whatsapp-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  ollama_data:
